<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPA フォーム + submit 横取り 送信テスト</title>
<style>
body { font-family: -apple-system, sans-serif; padding: 20px; line-height: 1.6; max-width: 600px; margin: 0 auto; }
form, .group { border: 1px solid #ccc; padding: 16px; margin-bottom: 20px; border-radius: 8px; }
input { padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; font-size: 16px; }
button { padding: 12px 16px; margin: 8px 0; font-size: 16px; width: 100%; cursor: pointer; }
label { font-weight: 600; font-size: 14px; }
details { margin: 16px 0; color: #666; font-size: 14px; }
details summary { cursor: pointer; padding: 8px 0; }
details pre { background: #f5f5f5; padding: 8px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
#log { background: #f5f5f5; padding: 8px; font-family: monospace; font-size: 12px; white-space: pre-wrap; max-height: 200px; overflow: auto; border-radius: 4px; margin-top: 16px; }
.back { display: inline-block; margin-bottom: 16px; color: #007aff; text-decoration: none; }
.note { color: #666; font-size: 14px; margin: 4px 0 16px; }
</style>
</head>
<body>
<a href="spa.html" class="back">← spa.html に戻る</a>
<h1>パターン G: フォーム + submit 横取り</h1>
<p>ID とパスワードを入力して、送信ボタンを押してください。</p>

<form id="reactGForm" action="success.html" method="GET">
  <label>ID</label>
  <input id="username" name="username" type="text" value="" autocomplete="username">
  <label>パスワード</label>
  <input id="password" name="password" type="password" value="" autocomplete="current-password">

  <button id="patternGBtn" type="submit">
    フォーム + submit イベント横取りで送信
  </button>
  <p class="note">送信ボタン押下 → submit イベント発火 → JavaScript で横取りして処理。React 等で典型的な書き方で、<strong>テスト対象ブラウザの保存機能でも拾えます</strong>。</p>
</form>

<h2>動作ログ</h2>
<div id="log">（ボタンを押すとここに JS の動作が表示されます）</div>

<script>
function log(msg) {
  const el = document.getElementById('log');
  const ts = new Date().toISOString().substr(11, 12);
  el.textContent += '[' + ts + '] ' + msg + '\n';
}

function fakeLoggedIn(pattern) {
  document.body.innerHTML =
    '<h1>ログイン完了 (パターン ' + pattern + ')</h1>' +
    '<p>このページは元の DOM を JavaScript で差し替えただけです。フォームが消えているため「成功推定」の対象になります。</p>' +
    '<p><a href="index.html">← トップへ戻る</a></p>';
}

function patternG(event) {
  event.preventDefault();
  log('パターン G: submit イベント発火後 preventDefault → fetch + pushState');
  fetch('success.html').then(function(r) {
    log('パターン G: fetch 完了 status=' + r.status);
    history.pushState({}, '', 'success.html?pattern=G');
    fakeLoggedIn('G');
  });
}

document.addEventListener('DOMContentLoaded', function() {
  var reactGForm = document.getElementById('reactGForm');
  if (reactGForm) {
    reactGForm.addEventListener('submit', patternG);
  }
});
</script>

</body>
</html>
